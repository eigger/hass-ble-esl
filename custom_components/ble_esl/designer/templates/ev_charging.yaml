# Generated by scripts/generate_ev_charging_template.py
template: 1
id: ev_charging
categories:
- smart_home
name:
  en: EV & battery charging
  ko: 전기차 · 배터리 충전
description:
  en: EV battery level with low-charge alert, charging status badge, and optional range and power sensors.
  ko: 전기차 배터리 잔량과 저잔량 경고, 충전 상태 배지, 선택 주행 거리·충전 전력을 표시합니다.
background: white
parameters:
  title:
    type: string
    default: EV 충전 상태
    min_length: 1
    label:
      en: Title
      ko: 제목
  battery_sensor:
    type: entity
    domain: sensor
    default: sensor.ev_battery
    label:
      en: Battery SOC sensor
      ko: 배터리 잔량 센서
  range_sensor:
    type: string
    default: ''
    label:
      en: Estimated range sensor ID (optional)
      ko: 주행 가능 거리 센서 ID (선택)
  status_sensor:
    type: string
    default: ''
    label:
      en: Charging status sensor ID (optional)
      ko: 충전 상태 센서 ID (선택)
  power_sensor:
    type: string
    default: ''
    label:
      en: Charging power sensor ID (optional)
      ko: 충전 전력 센서 ID (선택)
  low_threshold:
    type: number
    default: 20
    min: 5
    max: 50
    label:
      en: Low battery alert (%)
      ko: 저잔량 경고 기준 (%)
  accent:
    type: color
    default: red
    label:
      en: Highlight & alert color
      ko: 강조 · 경고 색상
  font:
    type: font
    default: NotoSansKR-Bold.ttf
    label:
      en: Font
      ko: 글꼴
  interval:
    type: select
    group: automation
    options:
    - '5'
    - '10'
    - '15'
    - '30'
    default: '10'
    label:
      en: Update every (minutes)
      ko: 갱신 주기 (분)
