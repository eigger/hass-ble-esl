template: 1
id: sensor_card
categories: [smart_home]
name:
  en: Sensor card
  ko: 센서 카드
description:
  en: A header bar with icon, title and time over the big value and unit of any sensor, plus how long ago it updated and an optional second sensor. Leave the title empty to use the entity's name.
  ko: 제목 막대 아래에 센서 하나의 큰 값과 단위, 마지막 갱신 시점과 선택 보조 센서를 표시합니다. 제목을 비우면 엔티티 이름을 사용합니다.
background: white

parameters:
  sensor:
    type: entity
    domain: sensor
    default: sensor.temperature
    label: { en: Sensor entity, ko: 센서 엔티티 }
  title:
    type: string
    default: ""
    label: { en: "Title (empty = entity name)", ko: "제목 (비우면 엔티티 이름)" }
  icon:
    type: string
    default: thermometer
    min_length: 1
    label: { en: Icon (Material Design Icons name), ko: 아이콘 (Material Design Icons 이름) }
  color:
    type: color
    default: black
    label: { en: Value color, ko: 값 색상 }
  warn_above:
    type: string
    default: ""
    label: { en: "Alert threshold (>= value, optional)", ko: "경고 기준값 (이상일 때 강조, 선택)" }
  warn_color:
    type: color
    default: red
    label: { en: Alert color, ko: 경고 색상 }
  font:
    type: font
    default: CookieRunBold.ttf
    label: { en: Font, ko: 글꼴 }
  interval:
    type: select
    group: automation
    options: ["5", "10", "15", "30"]
    default: "15"
    label: { en: Update every (minutes), ko: 갱신 주기 (분) }
  # BEGIN SIZE PARAMETERS
  secondary_sensor:
    type: string
    default: ""
    label: { en: Secondary sensor ID (optional), ko: 보조 센서 ID (선택) }
  # END SIZE PARAMETERS

layouts:
  # BEGIN GENERATED SIZE LAYOUTS
  200x200:
    - {type: rectangle, x_start: 0, y_start: 0, x_end: 199, y_end: 33, fill: black, outline: black}
    - {type: icon, value: '${icon}', x: 24, y: 17, size: 24, anchor: mm, color: white}
    - {type: text_fit, value: '{{ ''${title}'' or state_attr(''${sensor}'', ''friendly_name'') or '''' }}', font: '${font}', x: 44, y: 3, width: 148, height: 27, size: 17, min_size: 14, max_lines: 1, align: left, valign: middle, fit: shrink, color: white}
    - {type: text_fit, value: '{% set s = states(''${sensor}'') %}{% set n = s | float(none) %}{{ s if n is none or n != n else (n | round(1) | string | replace(''.0'', '''')) }}', font: '${font}', x: 8, y: 34, width: 184, height: 99, size: 66, min_size: 20, max_lines: 1, align: center, valign: middle, fit: shrink, color: &id001 '{% set s = states(''${sensor}'') %}{% set _w = ''${warn_above}'' %}{% set lim = (_w | float) if is_number(_w) else none %}{% set n = (s | float) if is_number(s) else none %}{{ (''black'' if ''${warn_color}'' == ''white'' else ''${warn_color}'') if lim is not none and n is not none and n >= lim else ''${color}'' }}'}
    - {type: text_fit, value: '{{ state_attr(''${sensor}'', ''unit_of_measurement'') or '''' }}', font: '${font}', x: 25, y: 110, width: 150, height: 35, size: 22, min_size: 14, max_lines: 1, align: center, valign: middle, fit: shrink, color: black}
    - {type: line, x_start: 8, y_start: 150, x_end: 192, y_end: 150, width: 1, fill: black}
    - {type: line, x_start: 100, y_start: 156, x_end: 100, y_end: 192, width: 1, fill: '{{ ''black'' if (''${secondary_sensor}''.startswith(''sensor.'') and states[''${secondary_sensor}''] is not none) else ''white'' }}'}
    - {type: icon, value: clock-outline, x: 18, y: 174, size: 18, anchor: mm, color: black}
    - {type: text_fit, value: &id002 '{% set s = states[''${sensor}''] %}{% set m = ((as_timestamp(now()) - as_timestamp(s.last_updated)) / 60) | int if s is not none else -1 %}{{ ''—'' if m < 0 else (''just now'' if m < 1 else (m ~ '' min ago'' if m < 60 else ((m // 60) ~ '' h ago'' if m < 1440 else (m // 1440) ~ '' d ago''))) }}', font: '${font}', x: 30, y: 163, width: 66, height: 22, size: 14, min_size: 14, max_lines: 1, align: left, valign: middle, fit: shrink, color: black}
    - {type: text_fit, value: &id003 '{% set e = states[''${secondary_sensor}''] if ''${secondary_sensor}''.startswith(''sensor.'') else none %}{% set ok = e is not none %}{{ (e.state ~ ('' '' ~ e.attributes.unit_of_measurement if e.attributes.unit_of_measurement is defined else '''')) if ok else '''' }}', font: '${font}', x: 100, y: 163, width: 94, height: 22, size: 14, min_size: 14, max_lines: 1, align: right, valign: middle, fit: shrink, color: black}
