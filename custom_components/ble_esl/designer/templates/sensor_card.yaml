template: 1
id: sensor_card
categories: [smart_home]
name:
  en: Sensor card
  ko: 센서 카드
description:
  en: An icon, a title and the value with its unit of any sensor. Leave the title empty to use the entity's name.
  ko: 센서 하나의 아이콘, 제목, 값과 단위를 표시합니다. 제목을 비우면 엔티티 이름을 사용합니다.
background: white

parameters:
  sensor:
    type: entity
    domain: sensor
    default: sensor.temperature
    label: { en: Sensor entity, ko: 센서 엔티티 }
  title:
    type: string
    default: ""
    label: { en: "Title (empty = entity name)", ko: "제목 (비우면 엔티티 이름)" }
  icon:
    type: string
    default: thermometer
    min_length: 1
    label: { en: Icon (Material Design Icons name), ko: 아이콘 (Material Design Icons 이름) }
  color:
    type: color
    default: black
    label: { en: Value color, ko: 값 색상 }
  warn_above:
    type: string
    default: ""
    label: { en: "Alert threshold (>= value, optional)", ko: "경고 기준값 (이상일 때 강조, 선택)" }
  warn_color:
    type: color
    default: red
    label: { en: Alert color, ko: 경고 색상 }
  font:
    type: font
    default: CookieRunBold.ttf
    label: { en: Font, ko: 글꼴 }
  interval:
    type: select
    group: automation
    options: ["5", "10", "15", "30"]
    default: "15"
    label: { en: Update every (minutes), ko: 갱신 주기 (분) }
  # BEGIN SIZE PARAMETERS
  secondary_sensor:
    type: string
    default: ""
    label: { en: Secondary sensor ID on larger tags, ko: 큰 화면의 보조 센서 ID }
  # END SIZE PARAMETERS

layouts:
  "250x128":
    - type: text_fit
      value: "{{ '${title}' or state_attr('${sensor}', 'friendly_name') or '' }}"
      font: ${font}
      x: 8
      y: 6
      width: 234
      height: 26
      size: 22
      min_size: 10
      fit: shrink
      align: center
      valign: middle
      color: black
    - type: line
      x_start: 8
      x_end: 242
      y_start: 36
      y_end: 36
      fill: black
      width: 1
    - type: icon
      value: ${icon}
      anchor: mm
      x: 40
      y: 82
      size: 56
      color: black
    - type: text_fit
      value: "{% set s = states('${sensor}') %}{% set n = s | float(none) %}{{ s if n is none or n != n else (n | round(1) | string | replace('.0', '')) }}"
      font: ${font}
      x: 76
      y: 44
      width: 108
      height: 76
      size: 60
      min_size: 14
      fit: shrink
      align: right
      valign: middle
      color: "{% set s = states('${sensor}') %}{% set _w = '${warn_above}' %}{% set lim = (_w | float) if is_number(_w) else none %}{% set n = (s | float) if is_number(s) else none %}{{ ('black' if '${warn_color}' == 'white' else '${warn_color}') if lim is not none and n is not none and n >= lim else '${color}' }}"
    - type: text_fit
      value: "{{ state_attr('${sensor}', 'unit_of_measurement') or '' }}"
      font: ${font}
      x: 190
      y: 44
      width: 54
      height: 76
      size: 26
      min_size: 10
      fit: shrink
      align: left
      valign: middle
      color: black
  "400x300":
