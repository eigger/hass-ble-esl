# Generated by scripts/generate_home_presence_template.py
template: 1
id: home_presence
categories:
- smart_home
name:
  en: Home presence
  ko: 가족 재실 · 현관
description:
  en: Track up to 4 household members (home, away, custom zones) with an optional entryway door sensor.
  ko: 가족 구성원 최대 4명의 재실·외출·위치 상태와 선택 현관문 센서를 한눈에 표시합니다.
background: white
parameters:
  title:
    type: string
    default: 가족 재실
    min_length: 1
    label:
      en: Title
      ko: 제목
  person_1:
    type: entity
    domain: person
    default: person.home
    label:
      en: Person 1
      ko: 구성원 1
  person_2:
    type: string
    default: ''
    label:
      en: Person 2 entity ID (optional)
      ko: 구성원 2 엔티티 ID (선택)
  person_3:
    type: string
    default: ''
    label:
      en: Person 3 entity ID (optional)
      ko: 구성원 3 엔티티 ID (선택)
  person_4:
    type: string
    default: ''
    label:
      en: Person 4 entity ID (optional)
      ko: 구성원 4 엔티티 ID (선택)
  door_sensor:
    type: string
    default: ''
    label:
      en: Entryway door sensor ID (optional)
      ko: 현관문 센서 ID (선택)
  accent:
    type: color
    default: red
    label:
      en: Accent color
      ko: 강조 색상
  font:
    type: font
    default: NotoSansKR-Bold.ttf
    label:
      en: Font
      ko: 글꼴
  interval:
    type: select
    group: automation
    options:
    - '5'
    - '10'
    - '15'
    - '30'
    default: '5'
    label:
      en: Update every (minutes)
      ko: 갱신 주기 (분)
