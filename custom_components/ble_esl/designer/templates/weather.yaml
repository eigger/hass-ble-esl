template: 1
id: weather_now
name:
  en: Weather now
  ko: 현재 날씨
description:
  en: Condition icon, temperature and humidity of a weather entity, refreshed every few minutes.
  ko: 날씨 엔티티의 상태 아이콘, 온도, 습도를 표시하고 몇 분마다 갱신합니다.
background: white

parameters:
  weather:
    type: entity
    domain: weather
    default: weather.home
    label: { en: Weather entity, ko: 날씨 엔티티 }
  date_format:
    type: string
    default: "%m/%d"
    label: { en: Date format (strftime), ko: 날짜 형식 (strftime) }
  font:
    type: font
    default: CookieRunBold.ttf
    label: { en: Font, ko: 글꼴 }
  interval:
    type: select
    group: automation
    options: ["10", "15", "30"]
    default: "30"
    label: { en: Update every (minutes), ko: 갱신 주기 (분) }

layouts:
  "400x300":
    - type: text
      value: "{{ now().strftime('${date_format}') }}"
      font: ${font}
      anchor: lt
      x: 10
      y: 10
      size: 22
      color: black
    - type: text
      value: "{{ state_attr('${weather}', 'friendly_name') or '' }}"
      font: ${font}
      anchor: rt
      x: 390
      y: 10
      size: 22
      color: black
    - type: icon
      value: "weather-{{ {'clear-night': 'night', 'exceptional': 'sunny-alert', 'partlycloudy': 'partly-cloudy', 'unknown': 'cloudy-alert', 'unavailable': 'cloudy-alert'}.get(states('${weather}'), states('${weather}')) }}"
      anchor: lt
      x: 15
      y: 70
      size: 110
      color: black
    - type: text
      value: "{% set t = state_attr('${weather}', 'temperature') %}{% set r = t | round(1) if t is number and t is not boolean and t == t and t | abs < 100000 else none %}{{ '--' if r is none else (r | int if r == r | int else r) }}"
      font: ${font}
      anchor: rt
      x: 335
      y: 62
      size: 72
      color: black
    - type: text
      value: "{{ state_attr('${weather}', 'temperature_unit') or '' }}"
      font: ${font}
      anchor: lt
      x: 341
      y: 66
      size: 28
      color: black
    - type: text
      value: "{{ state_translated('${weather}') }}"
      font: ${font}
      anchor: mt
      x: 250
      y: 170
      size: 30
      color: black
    - type: icon
      value: water-percent
      anchor: lt
      x: 150
      y: 225
      size: 40
      color: black
    - type: text
      value: "{% set h = state_attr('${weather}', 'humidity') %}{{ h ~ '%' if h is number and h is not boolean and h == h and h | abs < 100000 else '' }}"
      font: ${font}
      anchor: lt
      x: 195
      y: 228
      size: 36
      color: black
    - type: text
      value: "{{ now().strftime('%H:%M') }}"
      font: ${font}
      anchor: lb
      x: 10
      y: 290
      size: 20
      color: black
  "250x128":
    - type: text
      value: "{{ now().strftime('${date_format}') }}"
