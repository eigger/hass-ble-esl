template: 1
id: weather_now
categories: [weather]
name:
  en: Weather now
  ko: 현재 날씨
description:
  en: Condition icon, temperature, today's high and low, feels-like, humidity and wind of a weather entity, plus a three-hourly strip on large tags. The automation fetches the daily and hourly forecasts.
  ko: 날씨 엔티티의 상태 아이콘, 현재 온도, 오늘의 최고·최저, 체감온도, 습도, 바람을 표시하고 큰 태그에는 3시간 간격 예보를 더하며, 자동화가 일별·시간별 예보를 가져옵니다.
background: white

parameters:
  weather:
    type: entity
    domain: weather
    default: weather.home
    label: { en: Weather entity, ko: 날씨 엔티티 }
  date_format:
    type: string
    default: "%m/%d"
    label: { en: Date format (strftime), ko: 날짜 형식 (strftime) }
  accent:
    type: color
    default: red
    label: { en: Today's high color, ko: 오늘 최고 기온 색상 }
  font:
    type: font
    default: CookieRunBold.ttf
    label: { en: Font, ko: 글꼴 }
  interval:
    type: select
    group: automation
    options: ["10", "15", "30"]
    default: "30"
    label: { en: Update every (minutes), ko: 갱신 주기 (분) }

layouts:
  # BEGIN GENERATED SIZE LAYOUTS
  200x200:
    - {type: rectangle, x_start: 0, y_start: 172, x_end: 199, y_end: 199, fill: black, outline: black}
    - {type: text_fit, value: '{% set n = state_attr(''${weather}'', ''friendly_name'') or '''' %}{{ (n ~ '' · '' if n else '''') ~ now().strftime(''${date_format}'') }}', font: '${font}', x: 8, y: 172, width: 124, height: 28, size: 15, min_size: 14, max_lines: 1, align: left, valign: middle, fit: shrink, color: white}
    - {type: text_fit, value: '{{ now().strftime(''%H:%M'') }}', font: '${font}', x: 134, y: 172, width: 58, height: 28, size: 14, min_size: 8, max_lines: 1, align: right, valign: middle, fit: shrink, color: white}
    - {type: icon, value: &id001 'weather-{{ {''clear-night'': ''night'', ''exceptional'': ''sunny-alert'', ''partlycloudy'': ''partly-cloudy'', ''unknown'': ''cloudy-alert'', ''unavailable'': ''cloudy-alert''}.get(states(''${weather}''), states(''${weather}'')) }}', x: 46, y: 54, size: 68, anchor: mm, color: black}
    - {type: text_fit, value: &id002 '{% set t = state_attr(''${weather}'', ''temperature'') %}{% set r = t | round(0) | int if t is number and t is not boolean and t == t and t | abs < 100000 else none %}{{ ''—'' if r is none else r ~ ''°'' }}', font: '${font}', x: 84, y: 14, width: 110, height: 80, size: 60, min_size: 36, max_lines: 1, align: center, valign: middle, fit: shrink, color: black}
    - {type: text_fit, value: '{{ state_translated(''${weather}'') }}', font: '${font}', x: 8, y: 100, width: 184, height: 30, size: 22, min_size: 16, max_lines: 1, align: center, valign: middle, fit: shrink, color: black}
    - {type: icon, value: arrow-up-thin, x: 40, y: 148, size: 24, anchor: mm, color: '{{ ''black'' if ''${accent}'' in (''yellow'', ''white'') else ''${accent}'' }}'}
    - {type: text_fit, value: &id003 '{% set f = fc[''${weather}''].forecast | default([], true) if fc is defined and fc[''${weather}''] is defined else [] %}{% set n = namespace(r={}, dated=false) %}{% for i in f %}{% set t = as_datetime(i.datetime | default(none), none) %}{% if t is not none %}{% set n.dated = true %}{% if as_local(t).date() == now().date() %}{% set n.r = i %}{% break %}{% endif %}{% endif %}{% endfor %}{% if not n.dated and f | length > 0 %}{% set n.r = f[0] %}{% endif %}{% set row = n.r %}{% set v = row.temperature | default(none) %}{{ ((v | float | round(0) | int) ~ ''°'') if is_number(v) and v is not boolean else ''—'' }}', font: '${font}', x: 54, y: 132, width: 52, height: 32, size: 24, min_size: 16, max_lines: 1, align: left, valign: middle, fit: shrink, color: '{{ ''black'' if ''${accent}'' in (''yellow'', ''white'') else ''${accent}'' }}'}
