automation:
  triggers:
    - trigger: time_pattern
      minutes: /${interval}
  actions:
    - action: weather.get_forecasts
      target:
        entity_id: ${weather}
      data:
        type: daily
      response_variable: fc
      continue_on_error: true
    - action: weather.get_forecasts
      target:
        entity_id: ${weather}
      data:
        type: hourly
      response_variable: fc_hourly
      continue_on_error: true
  mode: single
