template: 1
id: message
categories: [labels]
name:
  en: Message
  ko: 메시지
description:
  en: Large centred text that shrinks to fit the display (one line by default).
  ko: 화면에 맞춰 줄어드는 가운데 정렬 큰 글자입니다(기본 한 줄).
background: white

parameters:
  text:
    type: string
    default: Hello
    label: { en: Text, ko: 문구 }
  color:
    type: color
    default: black
    label: { en: Text color, ko: 글자 색상 }
  lines:
    type: number
    default: 1
    min: 1
    max: 6
    label: { en: Maximum lines, ko: 최대 줄 수 }
  font:
    type: font
    default: GmarketSansTTFBold.ttf
    label: { en: Font, ko: 글꼴 }
  # BEGIN SIZE PARAMETERS
  subtitle:
    type: string
    default: ""
    label: { en: Second line on larger tags, ko: 큰 화면의 보조 문구 }
  # END SIZE PARAMETERS

layouts:
  "250x128":
    - type: text_fit
      value: ${text}
      font: ${font}
      x: 8
      y: 8
      width: 234
      height: 112
      color: ${color}
      size: 112
      min_size: 8
      fit: shrink
      max_lines: ${lines}
      align: center
      valign: middle
  # BEGIN GENERATED SIZE LAYOUTS
  200x200:
    - {type: text_fit, value: '${text}', font: '${font}', x: 10, y: 10, width: 180, height: 180, size: 180, min_size: 7, max_lines: '${lines}', align: center, valign: middle, fit: shrink, color: '${color}'}
  240x416:
    - {type: text_fit, value: '${text}', font: '${font}', x: 12, y: 21, width: 216, height: 374, size: 240, min_size: 7, max_lines: '${lines}', align: center, valign: middle, fit: shrink, color: '${color}'}
