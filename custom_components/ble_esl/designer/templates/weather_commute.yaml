  - {type: text_fit, value: &id074 '{% set _d = now().date() + timedelta(days=0) %}{% set _f = fc[''${weather}''].forecast | default([], true) if fc is defined and fc[''${weather}''] is defined else [] %}{% set _ns = namespace(r={}, dt=false) %}{% for i in _f %}{% set t = as_datetime(i.datetime | default(none), none) %}{% if t is not none %}{% set _ns.dt = true %}{% if as_local(t).date() == _d %}{% set _ns.r = i %}{% break %}{% endif %}{% endif %}{% endfor %}{% if not _ns.dt and _f | length > 0 %}{% set _ns.r = _f[0] %}{% endif %}{% set row = _ns.r %}{% set _st = states(''${weather}'') %}{% set _cond = row.condition | default(_st, true) %}{% set _p = row.precipitation_probability | default(none) %}{% set _pv = (_p | float | round(0) | int) if is_number(_p) and _p is not boolean else none %}{% set _amt = row.precipitation | default(none) %}{% set _amtv = (_amt | float) if is_number(_amt) and _amt is not boolean else 0 %}{% set _hi = row.temperature | default(none) %}{% set _lo = row.templow | default(none) %}{% set _gap = ((_hi | float) - (_lo | float)) | round(0) | int if is_number(_hi) and _hi is not boolean and is_number(_lo) and _lo is not boolean else 0 %}{% set _w = state_attr(''${weather}'', ''wind_speed'') %}{% set _wu = (state_attr(''${weather}'', ''wind_speed_unit'') or ''m/s'') | lower %}{% set _wv = (_w | float) if is_number(_w) and _w is not boolean else none %}{% set _windy = (_st in (''windy'', ''windy-variant'')) or (_wv is not none and ((_wu == ''km/h'' and _wv >= 25) or (_wu != ''km/h'' and _wv >= 7))) %}{% set _is_snow = (_st in (''snowy'', ''snowy-rainy'')) or (_cond in (''snowy'', ''snowy-rainy'')) %}{% set _is_rain = (_st in (''rainy'', ''pouring'', ''lightning-rainy'', ''hail'')) or (_cond in (''rainy'', ''pouring'', ''lightning-rainy'', ''hail'')) or (_pv is not none and _pv >= 50) or (_amtv > 0) %}{% set _kind = ''snow'' if _is_snow else (''rain'' if _is_rain else (''gap'' if _gap >= 10 else (''wind'' if _windy else ''ok''))) %}{{ (''• 눈 예보 ·