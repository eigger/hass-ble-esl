# Generated by scripts/generate_commute_weather_template.py
template: 1
id: weather_commute
categories:
- weather
name:
  en: Outing weather
  ko: 외출 날씨 브리핑
description:
  en: Outing briefing with an umbrella, snow, temperature-gap or wind verdict and an hourly forecast on 4-inch tags, a compact version on smaller tags and the weekly forecast on the largest. The automation fetches the daily and hourly forecasts.
  ko: 4인치 태그에는 우산·눈·일교차·강풍 판정과 시간대별 예보를, 더 작은 태그에는 간단한 브리핑을, 가장 큰 태그에는 주간 예보를 표시합니다. 자동화가 일별·시간별 예보를 가져옵니다.
background: white
parameters:
  weather:
    type: entity
    domain: weather
    default: weather.home
    label:
      en: Weather entity
      ko: 날씨 엔티티
  accent:
    type: color
    default: red
    label:
      en: Alert & weekend color
      ko: 비·눈 및 주말 강조 색상
  font:
    type: font
    default: NotoSansKR-Bold.ttf
    label:
      en: Font
      ko: 글꼴
  interval:
    type: select
    group: automation
    options:
    - '1'
    - '3'
    - '6'
    default: '1'
    label:
      en: Update every (hours)
      ko: 갱신 주기 (시간)
layouts:
  200x200:
  - {type: text_fit, value: &id001 '{% set _t = state_attr(''${weather}'', ''temperature'') %}{% set _r = (_t | float | round(1)) if is_number(_t) and _t is not boolean and (_t | float | abs) < 100000 else none %}{{ ''—'' if _r is none else ((_r | int if _r == _r | int else _r) ~ (state_attr(''${weather}'', ''temperature_unit'') or ''°'')) }}', font: '${font}', x: 8, y: 10, width: 184, height: 68, size: 54, valign: middle, min_size: 16, align: center}
  - {type: text_fit, value: &id002 '{% set _d = now().date() + timedelta(days=0) %}{% set _f = fc[''${weather}''].forecast | default([], true) if fc is defined and fc[''${weather}''] is defined else [] %}{% set _ns = namespace(r={}, dt=false) %}{% for i in _f %}{% set t = as_datetime(i.datetime | default(none), none) %}{% if t is not none %}{% set _ns.dt = true %}{% if as_local(t).date() == _d %}{% set _ns.r = i %}{% break %}{% endif %}{% endif %}{% endfor %}{% if not _ns.dt and _f | length > 0 %}{% set _ns.r = _f[0] %}{% endif %}{% set row = _ns.r %}{% set _v = row.templow | default(none) %}{{ (((_v | float | round(0) | int) ~ ''°'') if is_number(_v) and _v is not boolean else ''—'') }}', font: '${font}', x: 8, y: 84, width: 88, height: 36, size: 24, valign: middle, min_size: 16, align: center}
