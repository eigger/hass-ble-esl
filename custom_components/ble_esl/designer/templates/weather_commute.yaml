# Generated by scripts/generate_commute_weather_template.py
template: 1
id: weather_commute
name:
  en: Commute weather
  ko: 출근 날씨 브리핑
description:
  en: Morning commute briefing with rain/snow alerts, min/max & feels-like temperatures on tags under 4 inches, plus 5-7 day weekly forecasts on 4 inches and above.
  ko: 4인치 미만은 비·눈 우산 알림, 최저·최고·체감온도 중심의 출근 브리핑을, 4인치 이상은 오늘 요약과 5~7일 주간 예보를 표시합니다.
background: white
parameters:
  weather:
    type: entity
    domain: weather
    default: weather.home
    label:
      en: Weather entity
      ko: 날씨 엔티티
  accent:
    type: color
    default: red
    label:
      en: Alert & weekend color
      ko: 비·눈 및 주말 강조 색상
  font:
    type: font
    default: NotoSansKR-Bold.ttf
    label:
      en: Font
      ko: 글꼴
  interval:
    type: select
    group: automation
    options:
    - '1'
    - '3'
    - '6'
    default: '1'
    label:
      en: Update every (hours)
      ko: 갱신 주기 (시간)
