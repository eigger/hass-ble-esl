template: 1
id: energy_power
name:
  en: Energy & power
  ko: 에너지 · 전력 모니터
description:
  en: Live home power load against a target budget, plus optional daily energy and solar generation.
  ko: 실시간 소비 전력과 목표 전력 대비 부하 상태, 선택 일일 사용량·태양광 발전량을 표시합니다.
background: white
parameters:
  title:
    type: string
    default: 전력 모니터
    min_length: 1
    label:
      en: Title
      ko: 제목
  power_sensor:
    type: entity
    domain: sensor
    default: sensor.power
    label:
      en: Current power sensor
      ko: 현재 전력 센서
  today_energy_sensor:
    type: string
    default: ''
    label:
      en: Today energy sensor ID (optional)
      ko: 오늘 사용량 센서 ID (선택)
  solar_sensor:
    type: string
    default: ''
    label:
      en: Solar generation sensor ID (optional)
      ko: 태양광 발전 센서 ID (선택)
  budget_watts:
    type: number
    default: 3000
    min: 100
    max: 50000
    label:
      en: Target peak budget (W)
      ko: 목표 최대 전력 (W)
  accent:
    type: color
    default: red
    label:
      en: Alert color
      ko: 경고 강조 색상
  font:
    type: font
    default: NotoSansKR-Bold.ttf
    label:
      en: Font
      ko: 글꼴
  interval:
    type: select
    group: automation
    options:
    - '1'
    - '5'
    - '10'
    - '15'
    default: '5'
    label:
      en: Update every (minutes)
      ko: 갱신 주기 (분)
