  - {type: text_fit, value: &id017 '{% set _r = states(''${power_sensor}'') if ''${power_sensor}'' is match(''^[a-z][a-z0-9_]*[.][a-z0-9_]+$'') else '''' %}{% set _n = _r | float(none) if is_number(_r) and _r is not boolean else none %}{% set _p = _n if _n is not none and _n == _n and (_n | abs) < 1000000 else none %}{% set _pu = state_attr(''${power_sensor}'', ''unit_of_measurement'') or ''W'' %}{% set _pw = (_p * 1000) if (_p is not none and _pu in (''kW'', ''kw'', ''KW'')) else _p %}{% set _bg = (${budget_watts} | float(3000)) %}{% set _bg = _bg if _bg > 0 else 3000 %}{% set _ratio = ((_pw / _bg * 100) | round(0) | int) if _pw is not none else 0 %}{% set _pct = [0, [100, _ratio] | min] | max %}{% set _alert = _pw is not none and _pw >= (_bg * 0.8) %}{% set _ink = (''black'' if ''${accent}'' == ''white'' else ''${accent}'') %}{% set _fg = (''black'' if _ink == ''yellow'' else ''white'') %}{% set _tink = (''black'' if ''${accent}'' in (''yellow'', ''white'') else ''${accent}'') %}{% set _badge = ''센서 대기'' if _pw is none else (''과부하'' if _pw >= _bg else (''주의'' if _pw >= (_bg * 0.8) else (''발전 여유'' if _pw < 0 else (''보통'' if _pw >= (_bg * 0.5) else ''여유'')))) %}{% set _has_s = ''${solar_sensor}'' is match(''^[a-z][a-z0-9_]*[.][a-z0-9_]+$'') %}{% set _r = states(''${solar_sensor}'') if _has_s else '''' %}{% set _n = _r | float(none) if is_number(_r) and _r is not boolean else none %}{% set _s = _n if _n is not none and _n == _n and (_n | abs) < 1000000 else none %}{% set _su = (state_attr(''${solar_sensor}'', ''unit_of_measurement'') or ''W'') if _has_s else ''W'' %}{% set _sf = ((_s | round(0) | int) if _s == (_s | round(0)) else ((_s | round(2)) + 0)) if _s is not none else 0 %}{{ (''목표 전력('' ~ (_bg | round(0) | int) ~ ''W)을 초과했습니다 · 대기전력 차단을 권장합니다'') if (_pw is not none and _pw >= _bg) else (''전력 사용량이 높습니다 · 고전력 가전 동시 사용에 유의하세요'' if _alert else (''태양광 잉여 전력이 송전 중입니다'' if (_pw is not none and _pw < 0) else ((''태양광 '' ~ _sf ~ _su ~ '' 발전 중 · 현재 부하 '' ~ _ratio ~ ''%'') if (_s is not none and _s > 0) else ((''안정적인 전력 사용 중입니다 (목표 '' ~ (_bg | round(0) | int) ~ ''W 기준 '' ~ _ratio ~ ''%)'') if _pw is not none else ''전력 센서 연결을 확인해 주세요'')))) }}', font: '${font}', x: 34, y: 264, width: 346, height: 22, size: 11, min_size: 7, max_lines: 1, line_spacing: 0, fit: shrink_ellipsis, align: left, valign: middle, color: black}
