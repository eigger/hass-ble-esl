# Generated by scripts/generate_outdoor_weather_template.py
template: 1
id: weather_outdoor
name:
  en: Outdoor weather
  ko: 외출 날씨
description:
  en: Korean weather dashboard with precipitation timing, today's temperatures, and a weekly outlook on larger tags.
  ko: 비·눈 시간과 오늘 기온을 표시하며, 큰 태그에는 주간 및 시간대별 예보를 더합니다.
background: white
parameters:
  weather:
    type: entity
    domain: weather
    default: weather.home
    label:
      en: Weather entity
      ko: 날씨 엔티티
  snowfall_sensor:
    type: string
    default: ''
    label:
      en: Today's snowfall sensor (10.2 and 13.3 inches, optional)
      ko: 오늘 예상 적설 센서 ID (10.2·13.3인치, 선택)
  accent:
    type: color
    default: red
    label:
      en: Precipitation color
      ko: 비·눈 강조 색상
layouts:
  200x200:
  - type: text
    value: 오늘 날씨
    font: NotoSansKR-Bold.ttf
    x: 12
    y: 10
    size: 16
    anchor: lt
    color: black
