# Generated by scripts/generate_appliance_status_template.py
template: 1
id: appliance_status
name:
  en: Appliance status & alerts
  ko: 가전 상태 · 완료 알림
description:
  en: Track up to 3 home appliances with running, completion and error alerts plus optional remaining time.
  ko: 최대 3대의 가전 동작 상태와 완료·오류 알림, 선택 남은 시간·변경 시각을 한눈에 표시합니다.
background: white
parameters:
  title:
    type: string
    default: 가전 동작 상태
    min_length: 1
    label:
      en: Title
      ko: 제목
  appliance_1:
    type: entity
    domain: sensor
    default: sensor.washer_state
    label:
      en: Appliance 1 status sensor
      ko: 가전 1 상태 센서
  remaining_1:
    type: string
    default: ''
    label:
      en: Appliance 1 remaining sensor ID (optional)
      ko: 가전 1 남은 시간 센서 ID (선택)
  appliance_2:
    type: string
    default: ''
    label:
      en: Appliance 2 status sensor ID (optional)
      ko: 가전 2 상태 센서 ID (선택)
  remaining_2:
    type: string
    default: ''
    label:
      en: Appliance 2 remaining sensor ID (optional)
      ko: 가전 2 남은 시간 센서 ID (선택)
  appliance_3:
    type: string
    default: ''
    label:
      en: Appliance 3 status sensor ID (optional)
      ko: 가전 3 상태 센서 ID (선택)
  remaining_3:
    type: string
    default: ''
    label:
      en: Appliance 3 remaining sensor ID (optional)
      ko: 가전 3 남은 시간 센서 ID (선택)
  accent:
    type: color
    default: red
    label:
      en: Done & error alert color
      ko: 완료 · 오류 강조 색상
  font:
    type: font
    default: NotoSansKR-Bold.ttf
    label:
      en: Font
      ko: 글꼴
  interval:
    type: select
    group: automation
    options:
    - '1'
    - '5'
    - '10'
    - '15'
    default: '5'
    label:
      en: Update every (minutes)
      ko: 갱신 주기 (분)
