template: 1
id: calendar_next
categories: [schedule]
name:
  en: Next calendar event
  ko: 다음 일정
description:
  en: The current or next event of a calendar entity with a relative-time pill, its date, time and location, and the events after it on larger tags. Updates when the calendar changes.
  ko: 캘린더 엔티티의 진행 중이거나 다음 일정을 남은 시간, 날짜, 시간, 장소와 함께 표시하고 큰 화면에는 이어지는 일정도 보여 줍니다. 캘린더가 바뀌면 갱신됩니다.
background: white

parameters:
  calendar:
    type: entity
    domain: calendar
    default: calendar.home
    label: { en: Calendar entity, ko: 캘린더 엔티티 }
  heading:
    type: string
    default: Next event
    label: { en: Heading, ko: 머리글 }
  empty_text:
    type: string
    default: No events
    label: { en: Text when there is no event, ko: 일정이 없을 때 문구 }
  date_format:
    type: string
    default: "%m/%d"
    label: { en: Date format (strftime), ko: 날짜 형식 (strftime) }
  time_format:
    type: string
    default: "%H:%M"
    label: { en: Time format (strftime), ko: 시간 형식 (strftime) }
  accent:
    type: color
    default: red
    label: { en: Heading color, ko: 머리글 색상 }
  font:
    type: font
    default: NotoSansKR-Bold.ttf
    label: { en: Font, ko: 글꼴 }
  interval:
    type: select
    group: automation
    options: ["10", "15", "30"]
    default: "30"
    label: { en: Also update every (minutes), ko: 정기 갱신 주기 (분) }

layouts:
  # BEGIN GENERATED SIZE LAYOUTS
  200x200:
    - {type: rectangle, x_start: 0, y_start: 0, x_end: 199, y_end: 33, fill: black, outline: black}
    - {type: icon, value: calendar, x: 14, y: 17, size: 14, anchor: mm, color: white}
    - {type: text_fit, value: '${heading}', font: '${font}', x: 34, y: 4, width: 86, height: 26, size: 16, min_size: 14, max_lines: 1, align: left, valign: middle, fit: shrink, color: white}
    - {type: rectangle, x_start: 128, y_start: 4, x_end: 188, y_end: 30, fill: &id001 '{% set _evs = [] %}{% if _evs %}{% set _s = as_datetime((_evs[0].start | default('''')) | string, none) %}{% else %}{% set _a = state_attr(''${calendar}'', ''start_time'') %}{% set _s = as_datetime(_a, none) if _a else none %}{% endif %}{% if _s is not none and _s.tzinfo is not none %}{% set _s = as_local(_s) %}{% endif %}{% set _m = ((as_timestamp(_s) - as_timestamp(now())) / 60) | round(0, ''ceil'') | int if _s is not none else none %}{% set _rel = '''' if _m is none else (''now'' if _m <= 0 else (''in '' ~ _m ~ ''m'' if _m < 60 else (''in '' ~ (_m // 60) ~ ''h'' if _m < 2880 else ''in '' ~ (_m // 1440) ~ ''d''))) %}{{ ''white'' if _rel else ''black'' }}', outline: *id001, radius: 13}
    - {type: text_fit, value: &id003 '{% set _evs = [] %}{% if _evs %}{% set _s = as_datetime((_evs[0].start | default('''')) | string, none) %}{% else %}{% set _a = state_attr(''${calendar}'', ''start_time'') %}{% set _s = as_datetime(_a, none) if _a else none %}{% endif %}{% if _s is not none and _s.tzinfo is not none %}{% set _s = as_local(_s) %}{% endif %}{% set _m = ((as_timestamp(_s) - as_timestamp(now())) / 60) | round(0, ''ceil'') | int if _s is not none else none %}{% set _rel = '''' if _m is none else (''now'' if _m <= 0 else (''in '' ~ _m ~ ''m'' if _m < 60 else (''in '' ~ (_m // 60) ~ ''h'' if _m < 2880 else ''in '' ~ (_m // 1440) ~ ''d''))) %}{{ _rel }}', font: '${font}', x: 134, y: 6, width: 48, height: 22, size: 14, min_size: 14, max_lines: 1, align: center, valign: middle, fit: shrink, color: black}
    - {type: text_fit, value: '{% set _evs = [] %}{{ (_evs[0].summary | default(''${empty_text}'', true)) if _evs else (state_attr(''${calendar}'', ''message'') or ''${empty_text}'') }}', font: '${font}', x: 8, y: 40, width: 184, height: 84, size: 28, min_size: 17, max_lines: 3, align: left, valign: middle, fit: shrink, color: black}
    - {type: icon, value: clock-outline, x: 16, y: 140, size: 16, anchor: mm, color: '{% set _evs = [] %}{{ ''black'' if (_evs or state_attr(''${calendar}'', ''start_time'')) else ''white'' }}'}
    - {type: text_fit, value: &id002 '{% set _evs = [] %}{% if _evs %}{% set _sr = (_evs[0].start | default('''')) | string %}{% set _er = (_evs[0].end | default('''')) | string %}{% set _sd = as_datetime(_sr, none) %}{% set _ed = as_datetime(_er, none) %}{% if _sd is not none and _sd.tzinfo is not none %}{% set _sd = as_local(_sd) %}{% endif %}{% if _ed is not none and _ed.tzinfo is not none %}{% set _ed = as_local(_ed) %}{% endif %}{{ _sd.strftime(''${date_format}'' if _sr | length == 10 else ''${date_format} ${time_format}'') ~ (('' – '' ~ (_ed - timedelta(days=1)).strftime(''${date_format}'')) if _sr | length == 10 and _er | length == 10 and _ed is not none and (_ed.tzinfo is none) == (_sd.tzinfo is none) and _ed.date() > _sd.date() + timedelta(days=1) else ('' – '' ~ _ed.strftime(''${time_format}'' if _ed.date() == _sd.date() else ''${date_format} ${time_format}'') if _ed is not none and (_ed.tzinfo is none) == (_sd.tzinfo is none) and _ed >= _sd and _sr | length > 10 else '''')) if _sd is not none else '''' }}{% else %}{% set start = as_datetime(state_attr(''${calendar}'', ''start_time''), none) %}{% set end = as_datetime(state_attr(''${calendar}'', ''end_time''), none) %}{% set all_day = state_attr(''${calendar}'', ''all_day'') %}{{ start.strftime(''${date_format}'') ~ ('''' if all_day else '' '' ~ start.strftime(''${time_format}'') ~ ('' – '' ~ end.strftime(''${time_format}'' if end.date() == start.date() else ''${date_format} ${time_format}'') if end and (end.tzinfo is none) == (start.tzinfo is none) and end >= start else '''')) if start else '''' }}{% endif %}', font: '${font}', x: 30, y: 127, width: 164, height: 26, size: 16, min_size: 14, max_lines: 1, align: left, valign: middle, fit: shrink, color: black}
    - {type: icon, value: map-marker-outline, x: 16, y: 168, size: 16, anchor: mm, color: '{% set _evs = [] %}{{ ''black'' if ((_evs[0].location | default('''', true)) if _evs else (state_attr(''${calendar}'', ''location'') or '''')) else ''white'' }}'}
