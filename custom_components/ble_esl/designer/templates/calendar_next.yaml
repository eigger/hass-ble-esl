automation:
  triggers:
    - trigger: state
      entity_id: ${calendar}
    - trigger: time_pattern
      minutes: /${interval}
  actions:
    - action: calendar.get_events
      target:
        entity_id: ${calendar}
      data:
        duration:
          days: 7
      response_variable: events
      continue_on_error: true
  mode: single
