  - {type: text_fit, value: &id010 '{% set _r = states(''${temp_sensor}'') if ''${temp_sensor}'' is match(''^[a-z][a-z0-9_]*[.][a-z0-9_]+$'') else '''' %}{% set _n = _r | float(none) if is_number(_r) and _r is not boolean else none %}{% set _t = _n if _n is not none and _n == _n and (_n | abs) < 100000 else none %}{% set _tu = state_attr(''${temp_sensor}'', ''unit_of_measurement'') or ''°C'' %}{% set _is_f = _tu in (''°F'', ''F'') %}{% set _tc = ((_t - 32) * 5 / 9) if (_t is not none and _is_f) else _t %}{% set _r = states(''${humidity_sensor}'') if ''${humidity_sensor}'' is match(''^[a-z][a-z0-9_]*[.][a-z0-9_]+$'') else '''' %}{% set _n = _r | float(none) if is_number(_r) and _r is not boolean else none %}{% set _h = _n if _n is not none and _n == _n and (_n | abs) < 100000 else none %}{% set _has_c = ''${co2_sensor}'' is match(''^[a-z][a-z0-9_]*[.][a-z0-9_]+$'') %}{% set _r = states(''${co2_sensor}'') if _has_c else '''' %}{% set _n = _r | float(none) if is_number(_r) and _r is not boolean else none %}{% set _c = _n if _n is not none and _n == _n and (_n | abs) < 100000 else none %}{% set _has_p = ''${pm25_sensor}'' is match(''^[a-z][a-z0-9_]*[.][a-z0-9_]+$'') %}{% set _r = states(''${pm25_sensor}'') if _has_p else '''' %}{% set _n = _r | float(none) if is_number(_r) and _r is not boolean else none %}{% set _p = _n if _n is not none and _n == _n and (_n | abs) < 100000 else none %}{% set _ink = (''black'' if ''${accent}'' == ''white'' else ''${accent}'') %}{% set _fg = (''black'' if _ink == ''yellow'' else ''white'') %}{% set _tink = (''black'' if ''${accent}'' in (''yellow'', ''white'') else ''${accent}'') %}{% set _alert = (_c is not none and _c >= 1000) or (_p is not none and _p >= 36) or (_h is not none and (_h < 30 or _h > 65)) or (_tc is not none and (_tc > 28 or _tc < 16)) %}{% set _badge = ''환기 필수'' if (_c is not none and _c >= 1500) else (''환기 권장'' if (_c is not none and _c >= 1000) else (''먼지 나쁨'' if (_p is not none and _p >= 36) else (''건조 주의'' if (_h is not none and _h < 30) else (''다습 주의'' if (_h is not none and _h > 65) else (''고온 주의'' if (_tc is not none and _tc > 28) else (''저온 주의'' if (_tc is not none and _tc < 16) else (''센서 대기'' if (_t is none and _h is none) else (''쾌적'' if (_tc is not none and 20 <= _tc <= 26 and (_h is none or 40 <= _h <= 60)) else (''적정'' if (_h is not none and 40 <= _h <= 60 and _tc is none) else ''보통''))))))))) %}{{ (''CO2 '' ~ (_c | round(0) | int) ~ '' ppm'') if _c is not none else (''CO2 -- ppm'' if _has_c else ((''PM2.5 '' ~ (_p | round(0) | int) ~ '' ug/m3'') if _p is not none else (''PM2.5 --'' if _has_p else (''창문 환기 권장'' if (_c is not none and _c >= 1000) else (''가습기 사용 권장'' if (_h is not none and _h < 30) else (''제습 · 환기 권장'' if (_h is not none and _h > 65) else (''냉방 · 환기 권장'' if (_tc is not none and _tc > 28) else (''난방 상태 확인'' if (_tc is not none and _tc < 16) else (''센서 연결 확인'' if (_t is none and _h is none) else ((''적정 68~79°F'' if _is_f else ''적정 20~26°C'') if (_tc is not none and 20 <= _tc <= 26 and (_h is none or 40 <= _h <= 60)) else _badge)))))))))) }}', font: '${font}', x: 5, y: 148, width: 94, height: 27, size: 14, min_size: 9, max_lines: 1, align: center, valign: middle, color: black}
