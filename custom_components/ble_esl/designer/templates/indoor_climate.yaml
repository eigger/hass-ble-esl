# Generated by scripts/generate_indoor_climate_template.py
template: 1
id: indoor_climate
categories: [smart_home]
name:
  en: Indoor climate
  ko: 실내 환경
description:
  en: Indoor temperature, humidity, and comfort badge with optional CO2 and PM2.5 metrics and ventilation advice.
  ko: 실내 온도·습도와 쾌적 상태를 표시하며, 선택 CO2·초미세먼지(PM2.5) 센서로 환기 권장을 안내합니다.
background: white
parameters:
  title:
    type: string
    default: 실내 환경
    min_length: 1
    label:
      en: Title
      ko: 제목
  temp_sensor:
    type: entity
    domain: sensor
    default: sensor.temperature
    label:
      en: Temperature sensor
      ko: 온도 센서
  humidity_sensor:
    type: entity
    domain: sensor
    default: sensor.humidity
    label:
      en: Humidity sensor
      ko: 습도 센서
  co2_sensor:
    type: string
    default: ''
    label:
      en: CO2 sensor ID (optional)
      ko: CO2 센서 ID (선택)
  pm25_sensor:
    type: string
    default: ''
    label:
      en: PM2.5 sensor ID (optional)
      ko: 초미세먼지(PM2.5) 센서 ID (선택)
  accent:
    type: color
    default: red
    label:
      en: Alert color
      ko: 경고 강조 색상
  font:
    type: font
    default: NotoSansKR-Bold.ttf
    label:
      en: Font
      ko: 글꼴
  interval:
    type: select
    group: automation
    options:
    - '5'
    - '10'
    - '15'
    - '30'
    default: '10'
    label:
      en: Update every (minutes)
      ko: 갱신 주기 (분)
