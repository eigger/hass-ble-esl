template: 1
id: weather_forecast
name:
  en: Weather forecast
  ko: 날씨 예보
description:
  en: The next three days of a weather entity's daily forecast. Creating the automation adds the Weather - Get forecasts step that fills it in.
  ko: 날씨 엔티티의 앞으로 3일 일별 예보를 표시합니다. 자동화를 만들면 예보를 가져오는 단계가 함께 추가됩니다.
background: white

parameters:
  weather:
    type: entity
    domain: weather
    default: weather.home
    label: { en: Weather entity, ko: 날씨 엔티티 }
  font:
    type: font
    default: CookieRunBold.ttf
    label: { en: Font, ko: 글꼴 }
  interval:
    type: select
    group: automation
    options: ["1", "3", "6"]
    default: "3"
    label: { en: Update every (hours), ko: 갱신 주기 (시간) }

layouts:
  "400x300":
    - type: text
      value: "{{ state_translated('${weather}') }}"
      font: ${font}
      anchor: lt
      x: 10
      y: 10
      size: 22
      color: black
    - type: text
      value: "{% set f = fc['${weather}'].forecast if fc is defined and fc['${weather}'] is defined else [] %}{% set d = f[1] if f | length > 1 else {} %}{{ as_local(as_datetime(d.datetime)).strftime('%a') if d.datetime is defined else '' }}"
      font: ${font}
      anchor: mt
      x: 70
      y: 50
      size: 26
      color: black
    - type: icon
      value: "{% set f = fc['${weather}'].forecast if fc is defined and fc['${weather}'] is defined else [] %}{% set d = f[1] if f | length > 1 else {} %}weather-{{ {'clear-night': 'night', 'exceptional': 'sunny-alert', 'partlycloudy': 'partly-cloudy', 'unknown': 'cloudy-alert', 'unavailable': 'cloudy-alert'}.get(d.condition | default('cloudy', true), d.condition | default('cloudy', true)) }}"
      anchor: mt
      x: 70
      y: 90
      size: 90
      color: black
    - type: text
      value: "{% set f = fc['${weather}'].forecast if fc is defined and fc['${weather}'] is defined else [] %}{% set d = f[1] if f | length > 1 else {} %}{{ (d.temperature | round(0) | int) if d.temperature is defined and d.temperature is number else '--' }}°"
      font: ${font}
      anchor: mt
      x: 70
      y: 200
      size: 44
      color: black
    - type: text
      value: "{% set f = fc['${weather}'].forecast if fc is defined and fc['${weather}'] is defined else [] %}{% set d = f[1] if f | length > 1 else {} %}{{ (d.templow | round(0) | int) if d.templow is defined and d.templow is number else '--' }}°"
      font: ${font}
      anchor: mt
      x: 70
      y: 250
      size: 30
      color: black
    - type: text
      value: "{% set f = fc['${weather}'].forecast if fc is defined and fc['${weather}'] is defined else [] %}{% set d = f[2] if f | length > 2 else {} %}{{ as_local(as_datetime(d.datetime)).strftime('%a') if d.datetime is defined else '' }}"
