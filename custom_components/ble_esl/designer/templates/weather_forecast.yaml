template: 1
id: weather_forecast
categories: [weather]
name:
  en: Weather forecast
  ko: 날씨 예보
description:
  en: Today's weather on top, then the coming days with a precipitation chance and a low-to-high temperature bar on 4-inch tags (fewer days as columns on smaller ones, more days on larger ones). The automation fetches the forecasts.
  ko: 4인치 태그에는 오늘 날씨와 이어지는 날의 강수확률, 최저~최고 기온 막대를 표시합니다(작은 태그는 며칠을 열로, 큰 태그는 더 많은 날을 표시). 자동화가 일별 예보를 가져옵니다.
background: white

parameters:
  weather:
    type: entity
    domain: weather
    default: weather.home
    label: { en: Weather entity, ko: 날씨 엔티티 }
  accent:
    type: color
    default: red
    label: { en: Today's high and rain color, ko: 오늘 최고 기온·비 색상 }
  font:
    type: font
    default: CookieRunBold.ttf
    label: { en: Font, ko: 글꼴 }
  interval:
    type: select
    group: automation
    options: ["1", "3", "6"]
    default: "3"
    label: { en: Update every (hours), ko: 갱신 주기 (시간) }

layouts:
  "250x128":
    - type: text
      value: "{% set _raw = fc['${weather}'].forecast | default([], true) if fc is defined and fc['${weather}'] is defined else [] %}{% set _fn = namespace(rows=[], cur=false) %}{% for _i in _raw %}{% set _dt = as_datetime(_i.datetime | default(none), none) %}{% if _dt is not none and as_local(_dt).date() >= now().date() %}{% set _fn.cur = true %}{% break %}{% endif %}{% endfor %}{% if _fn.cur %}{% for _i in _raw %}{% set _dt = as_datetime(_i.datetime | default(none), none) %}{% if _dt is none or as_local(_dt).date() >= now().date() %}{% set _fn.rows = _fn.rows + [_i] %}{% endif %}{% endfor %}{% set f = _fn.rows %}{% else %}{% set f = _raw %}{% endif %}{% set d = f[1] if f | length > 1 else {} %}{% set _ddt = as_datetime(d.datetime | default(none), none) %}{{ as_local(_ddt).strftime('%a') if _ddt is not none else '' }}"
      font: ${font}
      anchor: mt
      x: 45
      y: 6
      size: 16
      color: black
    - type: icon
      value: "{% set _raw = fc['${weather}'].forecast | default([], true) if fc is defined and fc['${weather}'] is defined else [] %}{% set _fn = namespace(rows=[], cur=false) %}{% for _i in _raw %}{% set _dt = as_datetime(_i.datetime | default(none), none) %}{% if _dt is not none and as_local(_dt).date() >= now().date() %}{% set _fn.cur = true %}{% break %}{% endif %}{% endfor %}{% if _fn.cur %}{% for _i in _raw %}{% set _dt = as_datetime(_i.datetime | default(none), none) %}{% if _dt is none or as_local(_dt).date() >= now().date() %}{% set _fn.rows = _fn.rows + [_i] %}{% endif %}{% endfor %}{% set f = _fn.rows %}{% else %}{% set f = _raw %}{% endif %}{% set d = f[1] if f | length > 1 else {} %}weather-{{ {'clear-night': 'night', 'exceptional': 'sunny-alert', 'partlycloudy': 'partly-cloudy', 'unknown': 'cloudy-alert', 'unavailable': 'cloudy-alert'}.get(d.condition | default('cloudy', true), d.condition | default('cloudy', true)) }}"
      anchor: mt
      x: 45
      y: 26
      size: 44
      color: black
    - type: text
      value: "{% set _raw = fc['${weather}'].forecast | default([], true) if fc is defined and fc['${weather}'] is defined else [] %}{% set _fn = namespace(rows=[], cur=false) %}{% for _i in _raw %}{% set _dt = as_datetime(_i.datetime | default(none), none) %}{% if _dt is not none and as_local(_dt).date() >= now().date() %}{% set _fn.cur = true %}{% break %}{% endif %}{% endfor %}{% if _fn.cur %}{% for _i in _raw %}{% set _dt = as_datetime(_i.datetime | default(none), none) %}{% if _dt is none or as_local(_dt).date() >= now().date() %}{% set _fn.rows = _fn.rows + [_i] %}{% endif %}{% endfor %}{% set f = _fn.rows %}{% else %}{% set f = _raw %}{% endif %}{% set d = f[1] if f | length > 1 else {} %}{{ ((d.temperature | round(0) | int) ~ '°') if is_number(d.temperature | default(none)) and d.temperature is not boolean else '—' }}"
