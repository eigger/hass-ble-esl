automation:
  triggers:
    - trigger: time_pattern
      hours: /${interval}
      minutes: "0"
  actions:
    - action: weather.get_forecasts
      target:
        entity_id: ${weather}
      data:
        type: daily
      response_variable: fc
  mode: single
