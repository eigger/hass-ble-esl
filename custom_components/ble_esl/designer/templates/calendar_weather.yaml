# Generated by scripts/generate_calendar_weather_template.py
template: 1
id: calendar_weather
categories: [schedule, weather]
name:
  en: Calendar & weather
  ko: 캘린더 · 날씨
description:
  en: 'Combined schedule and weather dashboard: today''s weather and next event on compact tags, and upcoming events with a 4-day forecast from 4.2 inches.'
  ko: 오늘 일정과 날씨를 함께 보여줍니다. 작은 화면은 다음 일정 1건과 오늘 날씨를, 4.2인치 이상은 다가오는 일정 4건과 4일 예보를 표시합니다.
background: white
parameters:
  calendar:
    type: entity
    domain: calendar
    default: calendar.home
    label:
      en: Calendar entity
      ko: 캘린더 엔티티
  weather:
    type: entity
    domain: weather
    default: weather.home
    label:
      en: Weather entity
      ko: 날씨 엔티티
  accent:
    type: color
    default: red
    label:
      en: Accent color
      ko: 강조 색상
  font:
    type: font
    default: NotoSansKR-Bold.ttf
    label:
      en: Font
      ko: 글꼴
  time_format:
    type: string
    default: '%H:%M'
    min_length: 1
    label:
      en: Time format (strftime)
      ko: 시간 형식 (strftime)
  interval:
    type: select
    group: automation
    options:
    - '10'
    - '15'
    - '30'
    default: '15'
    label:
      en: Update every (minutes)
      ko: 갱신 주기 (분)
layouts:
  200x200:
  - {type: text_fit, value: &id001 '{% set _r = state_attr(''${weather}'', ''temperature'') %}{% set _n = _r | float(none) if is_number(_r) and _r is not boolean else none %}{% set _f = _n if _n is not none and _n == _n and (_n | abs) < 10000 else none %}{% set _r1 = ((_f | round(1)) + 0) if _f is not none else none %}{% set _t = ((0 if _r1 == 0 else _r1) | string | replace(''.0'', '''')) if _r1 is not none else ''--'' %}{{ _t ~ (state_attr(''${weather}'', ''temperature_unit'') or ''°C'') }}', font: '${font}', x: 8, y: 10, width: 184, height: 68, size: 54, min_size: 16, max_lines: 1, fit: shrink_ellipsis, align: center, valign: middle, color: black}
  - {type: line, x_start: 12, y_start: 82, x_end: 188, y_end: 82, width: 1, fill: black}
  - {type: text_fit, value: &id002 '{% set _st = as_datetime(state_attr(''${calendar}'', ''start_time''), none) %}{% set _ad = state_attr(''${calendar}'', ''all_day'') %}{% if _st is not none and _st.tzinfo is not none %}{% set _st = as_local(_st) %}{% endif %}{{ (_st.strftime(''%m/%d'') ~ ('' 종일'' if _ad else '' '' ~ _st.strftime(((''${time_format}'' | trim) or ''%H:%M'')))) if _st is not none else ''일정 대기'' }}', font: '${font}', x: 8, y: 88, width: 184, height: 34, size: 24, min_size: 16, max_lines: 1, fit: shrink_ellipsis, align: center, valign: middle, color: &id003 '{{ (''black'' if ''${accent}'' in (''yellow'', ''white'') else ''${accent}'') }}'}
