# Generated by scripts/generate_calendar_weather_template.py
template: 1
id: calendar_weather
categories:
- schedule
- weather
name:
  en: Calendar & weather
  ko: 캘린더 · 날씨
description:
  en: 'Combined schedule and weather dashboard: today''s weather and next event on compact tags, and upcoming events with a 4-day forecast from 4.2 inches.'
  ko: 오늘 일정과 날씨를 함께 보여줍니다. 작은 화면은 다음 일정 1건과 오늘 날씨를, 4.2인치 이상은 다가오는 일정 4건과 4일 예보를 표시합니다.
background: white
parameters:
  calendar:
    type: entity
    domain: calendar
    default: calendar.home
    label:
      en: Calendar entity
      ko: 캘린더 엔티티
  weather:
    type: entity
    domain: weather
    default: weather.home
    label:
      en: Weather entity
      ko: 날씨 엔티티
  accent:
    type: color
    default: red
    label:
      en: Accent color
      ko: 강조 색상
  font:
    type: font
    default: NotoSansKR-Bold.ttf
    label:
      en: Font
      ko: 글꼴
  time_format:
    type: string
    default: '%H:%M'
    min_length: 1
    label:
      en: Time format (strftime)
      ko: 시간 형식 (strftime)
  interval:
    type: select
    group: automation
    options:
    - '10'
    - '15'
    - '30'
    default: '15'
    label:
      en: Update every (minutes)
      ko: 갱신 주기 (분)
