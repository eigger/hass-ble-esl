template: 1
id: date_weather
categories: [schedule, weather]
name:
  en: Date and weather
  ko: 날짜와 날씨
description:
  en: Today's date and weekday above the current condition and temperature of a weather entity with today's high, low and chance of rain. Refreshed every few minutes; the automation fetches the daily forecast.
  ko: 오늘 날짜와 요일 아래에 날씨 엔티티의 현재 상태와 온도, 오늘의 최고·최저 기온과 강수 확률을 표시하고 몇 분마다 갱신하며, 자동화가 일별 예보를 가져옵니다.
background: white

parameters:
  weather:
    type: entity
    domain: weather
    default: weather.home
    label: { en: Weather entity, ko: 날씨 엔티티 }
  date_format:
    type: string
    default: "%m/%d"
    label: { en: Date format (strftime), ko: 날짜 형식 (strftime) }
  weekdays:
    type: string
    default: Mon,Tue,Wed,Thu,Fri,Sat,Sun
    label: { en: "Weekday names, Monday first", ko: "요일 이름 (월요일부터, 쉼표로 구분)" }
  weekend_color:
    type: color
    default: red
    label: { en: Weekend color, ko: 주말 색상 }
  font:
    type: font
    default: CookieRunBold.ttf
    label: { en: Font, ko: 글꼴 }
  interval:
    type: select
    group: automation
    options: ["10", "15", "30"]
    default: "30"
    label: { en: Update every (minutes), ko: 갱신 주기 (분) }

layouts:
  # BEGIN GENERATED SIZE LAYOUTS
  200x200:
    - {type: text_fit, value: '{{ now().strftime(''${date_format}'') }}', font: '${font}', x: 8, y: 0, width: 184, height: 67, size: 42, min_size: 21, max_lines: 1, align: center, valign: middle, fit: shrink, color: black}
    - {type: text_fit, value: '{% set names = ''${weekdays}''.split('','') %}{{ names[now().weekday()] if names | length > now().weekday() else '''' }}', font: '${font}', x: 8, y: 47, width: 184, height: 38, size: 24, min_size: 14, max_lines: 1, align: center, valign: middle, fit: shrink, color: '{{ ''${weekend_color}'' if now().weekday() >= 5 else ''black'' }}'}
    - {type: line, x_start: 10, y_start: 86, x_end: 190, y_end: 86, width: 2, fill: black}
    - {type: icon, value: &id001 'weather-{{ {''clear-night'': ''night'', ''exceptional'': ''sunny-alert'', ''partlycloudy'': ''partly-cloudy'', ''unknown'': ''cloudy-alert'', ''unavailable'': ''cloudy-alert''}.get(states(''${weather}''), states(''${weather}'')) }}', x: 44, y: 122, size: 56, anchor: mm, color: black}
    - {type: text_fit, value: &id002 '{% set t = state_attr(''${weather}'', ''temperature'') %}{% set r = t | round(0) | int if t is number and t is not boolean and t == t and t | abs < 100000 else none %}{{ ''—'' if r is none else r ~ ''°'' }}', font: '${font}', x: 78, y: 81, width: 116, height: 70, size: 44, min_size: 22, max_lines: 1, align: left, valign: middle, fit: shrink, color: black}
    - {type: text_fit, value: '{{ state_translated(''${weather}'') }}', font: '${font}', x: 8, y: 138, width: 184, height: 27, size: 17, min_size: 14, max_lines: 1, align: center, valign: middle, fit: shrink, color: black}
    - {type: icon, value: arrow-up-thin, x: 14, y: 180, size: 18, anchor: mm, color: red}
    - {type: text_fit, value: &id003 '{% set f = fc[''${weather}''].forecast | default([], true) if fc is defined and fc[''${weather}''] is defined else [] %}{% set n = namespace(r={}, dated=false) %}{% for i in f %}{% set t = as_datetime(i.datetime | default(none), none) %}{% if t is not none %}{% set n.dated = true %}{% if as_local(t).date() == now().date() %}{% set n.r = i %}{% break %}{% endif %}{% endif %}{% endfor %}{% if not n.dated and f | length > 0 %}{% set n.r = f[0] %}{% endif %}{% set row = n.r %}{% set v = row.temperature | default(none) %}{{ ((v | float | round(0) | int) ~ ''°'') if is_number(v) and v is not boolean else ''—'' }}', font: '${font}', x: 24, y: 167, width: 35, height: 26, size: 16, min_size: 14, max_lines: 1, align: left, valign: middle, fit: shrink, color: red}
