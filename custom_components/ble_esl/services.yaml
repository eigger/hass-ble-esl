write:
  target:
    entity:
      integration: ble_esl
  fields:
    payload:
      required: true
      example: |
        - type: text
          value: Hello World!
          x: 10
          "y": 10
          size: 40
      default:
        - type: text
          value: Hello World!
          x: 10
          "y": 10
          size: 40
      selector:
        object:
    design_specs:
      required: false
      description: Legacy field. The imagespec templates saved with an older designer source, rendered by Home Assistant with the automation variables.
      selector:
        object:
    design:
      required: false
      description: Legacy field. The designer source an older release saved; it still runs, but the designer now saves only the payload.
      selector:
        object:
    rotate:
      required: false
      example: '0'
      selector:
        number:
          min: 0
          max: 270
          step: 90
    background:
      required: false
      example: white
      selector:
        select:
          options:
            - "white"
            - "black"
            - "red"
            - "yellow"
    dry_run:
      required: false
      example: 'false'
      selector:
        boolean:
write_guarded:
  target:
    entity:
      integration: ble_esl
  fields:
    payload:
      required: true
      example: |
        - type: text
          value: Hello World!
          x: 10
          "y": 10
          size: 40
      default:
        - type: text
          value: Hello World!
          x: 10
          "y": 10
          size: 40
      selector:
        object:
    design_specs:
      required: false
      description: Legacy field. The imagespec templates saved with an older designer source, rendered by Home Assistant with the automation variables.
      selector:
        object:
    design:
      required: false
      description: Legacy field. The designer source an older release saved; it still runs, but the designer now saves only the payload.
      selector:
        object:
    rotate:
      required: false
      example: '0'
      selector:
        number:
          min: 0
          max: 270
          step: 90
    background:
      required: false
      example: white
      selector:
        select:
          options:
            - "white"
            - "black"
            - "red"
            - "yellow"
    dry_run:
      required: false
      example: 'false'
      selector:
        boolean:
    debounce_override_ms:
      required: false
      example: 5000
      selector:
        number:
          min: 0
          max: 120000
          step: 1000
          unit_of_measurement: ms
