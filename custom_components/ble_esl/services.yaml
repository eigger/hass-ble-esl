write:
  target:
    entity:
      integration: ble_esl
  fields:
    payload:
      required: false
      example: |
        - type: text
          value: Hello World!
          x: 10
          "y": 10
          size: 40
      default:
        - type: text
          value: Hello World!
          x: 10
          "y": 10
          size: 40
      selector:
        object:
    use_saved_design:
      description: Render the current design saved for the target tag, including bindings and conditional rules.
      selector:
        boolean:
    design_variables:
      selector:
        object:
    design_specs:
      required: false
      description: imagespec element templates from the designer source, rendered by Home Assistant with the automation variables.
      selector:
        object:
    design:
      required: false
      description: Original designer document; renders entity bindings and conditional rules at each write.
      selector:
        object:
    rotate:
      required: false
      example: '0'
      selector:
        number:
          min: 0
          max: 270
          step: 90
    background:
      required: false
      example: white
      selector:
        select:
          options:
            - "white"
            - "black"
            - "red"
            - "yellow"
    debounce_override_ms:
      selector:
        number:
          min: 0
          max: 120000
          step: 1000
          mode: box
          unit_of_measurement: ms
    skip_unchanged:
      default: true
      selector:
        boolean:
    dry_run:
      required: false
      example: 'false'
      selector:
        boolean:
