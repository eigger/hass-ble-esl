# Ruff configuration.
#
# Whole rule families are enabled below, so a ruff release that adds a rule to
# one of them could fail CI without a code change. The ruff version is
# therefore pinned (requirements_lint.txt) and bumped by Dependabot; fix
# whatever the new version reports in the same PR.
line-length = 100
# Lowest interpreter in the CI matrix; UP must not emit syntax newer than this.
target-version = "py312"

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (undefined names, unused imports, ...)
    "I",   # import ordering
    "UP",  # pyupgrade: modern syntax for the supported Python versions
    "B",   # bugbear: likely bugs (loop-variable closures, mutable defaults, ...)
    "SIM", # simplify
    "RUF", # ruff-specific (unsorted __all__, ambiguous regex in pytest.raises, ...)
]
ignore = [
    # Long lines: the device catalogue and log/error messages are more readable
    # unwrapped; the formatter keeps everything else within line-length.
    "E501",
    # Mutable class attributes are the declarative backend contract (PRESETS).
    "RUF012",
]

[lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components"]

[format]
docstring-code-format = true
