blueprint:
  name: BLE ESL presence
  description: >
    One cell per person, wrapped into rows. Each cell is a column of icon
    and name, so a longer name stays inside its cell instead of using a
    hand-tuned x coordinate.
  domain: automation
  author: BLE ESL
  input:
    tag:
      name: Tag
      selector:
        device:
          integration: ble_esl
    people:
      name: People
      selector:
        entity:
          domain: person
          multiple: true
    per_row:
      name: People per row
      description: How many cells share a row before the next row starts. Use 3 on a 2.9" tag and 4 or more on a 4.2" tag.
      default: 3
      selector:
        number:
          min: 1
          max: 8
          step: 1
          mode: slider
    text_size:
      name: Name size
      description: Name size in pixels. The icon uses the same size.
      default: 16
      selector:
        number:
          min: 10
          max: 48
          step: 1
          mode: slider
    font:
      name: Font
      description: >
        Font file name for the names. The component looks in its own fonts
        folder, then config/www/fonts. Default is the built-in Noto Sans KR.
      default: NotoSansKR-Regular.ttf
      selector:
        text:
    pattern_hours:
      name: Hour pattern
      description: >
        Time pattern, not a clock time. /1 matches every hour, /3 every 3
        hours, * every hour. The tag also redraws when a person changes
        state and when Home Assistant starts.
      default: "/1"
      selector:
        text:
    pattern_minutes:
      name: Minute pattern
      description: "0 matches that minute, /15 matches every 15 minutes, * matches every minute."
      default: "0"
      selector:
        text:
    pattern_seconds:
      name: Second pattern
      description: Keep this at 0. Leaving it open fires once a second during the matching minute.
      default: "0"
      selector:
        text:

triggers:
  - trigger: state
    entity_id: !input people
  - trigger: time_pattern
    hours: !input pattern_hours
    minutes: !input pattern_minutes
    seconds: !input pattern_seconds
  - trigger: homeassistant
    event: start

variables:
  font: !input font
  people: !input people
  per_row: !input per_row
  text_size: !input text_size

actions:
  - action: ble_esl.write_guarded
    target:
      device_id: !input tag
    data:
      payload: |
        {% set width = per_row | int %}
        {% set ns = namespace(cells=[]) %}
        {% for pid in people %}
          {% set at_home = is_state(pid, 'home') %}
          {% set ns.cells = ns.cells + [{
            'type': 'column',
            'align': 'center',
            'gap': 4,
            'elements': [
              {
                'type': 'icon',
                'value': 'mdi:home' if at_home else 'mdi:walk',
                'size': text_size | int,
                'color': 'black' if at_home else 'red'
              },
              {
                'type': 'text',
                'value': state_attr(pid, 'friendly_name') or pid,
                'font': font,
                'size': text_size | int,
                'align': 'center',
                'color': 'black' if at_home else 'red'
              }
            ]
          }] %}
        {% endfor %}
        {% set layout = namespace(rows=[]) %}
        {% for i in range(0, ns.cells | length, width) %}
          {% set layout.rows = layout.rows + [{
            'type': 'row',
            'justify': 'evenly',
            'align': 'center',
            'elements': ns.cells[i:i + width]
          }] %}
        {% endfor %}
        [
          {
            "type": "column",
            "padding": 8,
            "gap": 8,
            "justify": "center",
            "align": "center",
            "elements": {{ layout.rows | tojson }}
          }
        ]
mode: single
