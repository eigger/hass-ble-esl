blueprint:
  name: BLE ESL date
  description: >
    One date layout for every tag size. The tag model carries its resolution,
    and this blueprint picks a strip, a square, or a large arrangement from
    that height. Date line and second line are templates you can replace.
  domain: automation
  author: BLE ESL
  input:
    tag:
      name: Tag
      description: BLE ESL device to update.
      selector:
        device:
          integration: ble_esl
    pattern_hours:
      name: Hour pattern
      description: >
        Time pattern, not a clock time. 0 matches that hour, /6 matches every
        6 hours, * matches every hour. The tag also redraws when Home Assistant starts.
      default: "0"
      selector:
        text:
    pattern_minutes:
      name: Minute pattern
      description: "0 matches that minute, /15 matches every 15 minutes, * matches every minute."
      default: "0"
      selector:
        text:
    pattern_seconds:
      name: Second pattern
      description: Keep this at 0. Leaving it open fires once a second during the matching minute.
      default: "0"
      selector:
        text:
    date_text:
      name: Date line
      description: >
        The default is a template and changes every day. Replace it with your
        own text or template.
      default: "{{ now().month }}/{{ now().day }}"
      selector:
        text:
    weekday_text:
      name: Second line
      description: >
        The default is the weekday from the clock, which follows the host
        locale and is often English. Replace it with your own text or template.
      default: "{{ now().strftime('%A') }}"
      selector:
        text:
    text_scale:
      name: Text scale
      description: Percent applied on top of the size chosen for this tag.
      default: 100
      selector:
        number:
          min: 50
          max: 200
          step: 10
          mode: slider
          unit_of_measurement: "%"
    font:
      name: Font
      description: >
        Font file name. The component looks in its own fonts folder, then
        config/www/fonts. Default is the built-in Noto Sans KR.
      default: NotoSansKR-Regular.ttf
      selector:
        text:

triggers:
  - trigger: time_pattern
    hours: !input pattern_hours
    minutes: !input pattern_minutes
    seconds: !input pattern_seconds
  - trigger: homeassistant
    event: start

variables:
  tag_id: !input tag
  text_scale: !input text_scale
  model: "{{ device_attr(tag_id, 'model') | default('', true) }}"
  height: >-
    {% set ns = namespace(h=128) %}
    {% for piece in model.split() %}
      {% set bits = piece.split('x') %}
      {% if bits | length == 2 and bits[0].isdigit() and bits[1].isdigit() %}
        {% set ns.h = bits[1] | int %}
      {% endif %}
    {% endfor %}
    {{ ns.h }}

actions:
  - action: ble_esl.write_guarded
    target:
      device_id: !input tag
    data:
      payload:
        - type: row
          visible: "{{ height | int < 200 }}"
          padding: 6
          gap: 10
          justify: center
          align: center
          elements:
            - type: text
              font: !input font
              align: center
              size: "{{ (height | int * 0.45 * (text_scale | int) / 100) | int }}"
              value: !input date_text
            - type: text
              font: !input font
              align: center
              size: "{{ (height | int * 0.28 * (text_scale | int) / 100) | int }}"
              color: "{{ 'red' if now().weekday() >= 5 else 'black' }}"
              value: !input weekday_text
        - type: column
          visible: "{{ 200 <= (height | int) < 450 }}"
          padding: 16
          gap: 8
          justify: center
          align: center
          elements:
            - type: text
              font: !input font
              align: center
              size: "{{ (height | int * 0.42 * (text_scale | int) / 100) | int }}"
              value: !input date_text
            - type: text
              font: !input font
              align: center
              size: "{{ (height | int * 0.16 * (text_scale | int) / 100) | int }}"
              color: "{{ 'red' if now().weekday() >= 5 else 'black' }}"
              value: !input weekday_text
        - type: column
          visible: "{{ height | int >= 450 }}"
          padding: 28
          gap: 16
          justify: center
          align: center
          elements:
            - type: text
              font: !input font
              align: center
              size: "{{ (height | int * 0.34 * (text_scale | int) / 100) | int }}"
              value: !input date_text
            - type: text
              font: !input font
              align: center
              size: "{{ (height | int * 0.12 * (text_scale | int) / 100) | int }}"
              color: "{{ 'red' if now().weekday() >= 5 else 'black' }}"
              value: !input weekday_text
mode: single
