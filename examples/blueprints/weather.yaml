blueprint:
  name: BLE ESL weather
  description: >
    One weather layout for every tag size. The tag model carries its
    resolution. A short tag keeps icon and temperature on one line. A 4.2"
    tag stacks them. A large tag puts a big icon beside the readings.
    The condition name is Home Assistant's translated state.
  domain: automation
  author: BLE ESL
  input:
    tag:
      name: Tag
      selector:
        device:
          integration: ble_esl
    weather:
      name: Weather
      selector:
        entity:
          domain: weather
    pattern_hours:
      name: Hour pattern
      description: >
        Time pattern, not a clock time. /1 matches every hour, /3 every 3
        hours, * every hour. The tag also redraws when the weather entity
        changes and when Home Assistant starts.
      default: "/1"
      selector:
        text:
    pattern_minutes:
      name: Minute pattern
      description: "0 matches that minute, /15 matches every 15 minutes, * matches every minute."
      default: "0"
      selector:
        text:
    pattern_seconds:
      name: Second pattern
      description: Keep this at 0. Leaving it open fires once a second during the matching minute.
      default: "0"
      selector:
        text:
    text_scale:
      name: Text scale
      description: Percent applied on top of the size chosen for this tag.
      default: 100
      selector:
        number:
          min: 50
          max: 200
          step: 10
          mode: slider
          unit_of_measurement: "%"
    font:
      name: Font
      description: >
        Font file name. The component looks in its own fonts folder, then
        config/www/fonts. Default is the built-in Noto Sans KR.
      default: NotoSansKR-Regular.ttf
      selector:
        text:

triggers:
  - trigger: state
    entity_id: !input weather
  - trigger: time_pattern
    hours: !input pattern_hours
    minutes: !input pattern_minutes
    seconds: !input pattern_seconds
  - trigger: homeassistant
    event: start

variables:
  tag_id: !input tag
  text_scale: !input text_scale
  weather: !input weather
  model: "{{ device_attr(tag_id, 'model') | default('', true) }}"
  height: >-
    {% set ns = namespace(h=128) %}
    {% for piece in model.split() %}
      {% set bits = piece.split('x') %}
      {% if bits | length == 2 and bits[0].isdigit() and bits[1].isdigit() %}
        {% set ns.h = bits[1] | int %}
      {% endif %}
    {% endfor %}
    {{ ns.h }}

actions:
  - action: ble_esl.write_guarded
    target:
      device_id: !input tag
    data:
      payload:
        - type: row
          visible: "{{ height | int < 200 }}"
          padding: 6
          gap: 8
          justify: center
          align: center
          elements:
            - type: icon
              size: "{{ (height | int * 0.55 * (text_scale | int) / 100) | int }}"
              value: >-
                {% set icons = {
                  'sunny': 'mdi:weather-sunny',
                  'clear-night': 'mdi:weather-night',
                  'partlycloudy': 'mdi:weather-partly-cloudy',
                  'cloudy': 'mdi:weather-cloudy',
                  'rainy': 'mdi:weather-rainy',
                  'pouring': 'mdi:weather-pouring',
                  'snowy': 'mdi:weather-snowy',
                  'fog': 'mdi:weather-fog',
                  'windy': 'mdi:weather-windy',
                  'lightning': 'mdi:weather-lightning',
                  'hail': 'mdi:weather-hail',
                  'lightning-rainy': 'mdi:weather-lightning-rainy',
                  'snowy-rainy': 'mdi:weather-snowy-rainy'
                } %}
                {{ icons.get(states(weather), 'mdi:weather-cloudy') }}
            - type: text
              font: !input font
              size: "{{ (height | int * 0.38 * (text_scale | int) / 100) | int }}"
              value: >-
                {{ state_attr(weather, 'temperature') }}{{ state_attr(weather, 'temperature_unit') }}
        - type: column
          visible: "{{ 200 <= (height | int) < 450 }}"
          padding: 16
          gap: 8
          justify: center
          align: center
          elements:
            - type: icon
              size: "{{ (height | int * 0.28 * (text_scale | int) / 100) | int }}"
              value: >-
                {% set icons = {
                  'sunny': 'mdi:weather-sunny',
                  'clear-night': 'mdi:weather-night',
                  'partlycloudy': 'mdi:weather-partly-cloudy',
                  'cloudy': 'mdi:weather-cloudy',
                  'rainy': 'mdi:weather-rainy',
                  'pouring': 'mdi:weather-pouring',
                  'snowy': 'mdi:weather-snowy',
                  'fog': 'mdi:weather-fog',
                  'windy': 'mdi:weather-windy',
                  'lightning': 'mdi:weather-lightning',
                  'hail': 'mdi:weather-hail',
                  'lightning-rainy': 'mdi:weather-lightning-rainy',
                  'snowy-rainy': 'mdi:weather-snowy-rainy'
                } %}
                {{ icons.get(states(weather), 'mdi:weather-cloudy') }}
            - type: text
              font: !input font
              size: "{{ (height | int * 0.22 * (text_scale | int) / 100) | int }}"
              value: >-
                {{ state_attr(weather, 'temperature') }}{{ state_attr(weather, 'temperature_unit') }}
            - type: text
              font: !input font
              size: "{{ (height | int * 0.1 * (text_scale | int) / 100) | int }}"
              value: "{{ state_translated(weather) }}"
        - type: row
          visible: "{{ height | int >= 450 }}"
          padding: 28
          gap: 24
          justify: center
          align: center
          elements:
            - type: icon
              size: "{{ (height | int * 0.28 * (text_scale | int) / 100) | int }}"
              value: >-
                {% set icons = {
                  'sunny': 'mdi:weather-sunny',
                  'clear-night': 'mdi:weather-night',
                  'partlycloudy': 'mdi:weather-partly-cloudy',
                  'cloudy': 'mdi:weather-cloudy',
                  'rainy': 'mdi:weather-rainy',
                  'pouring': 'mdi:weather-pouring',
                  'snowy': 'mdi:weather-snowy',
                  'fog': 'mdi:weather-fog',
                  'windy': 'mdi:weather-windy',
                  'lightning': 'mdi:weather-lightning',
                  'hail': 'mdi:weather-hail',
                  'lightning-rainy': 'mdi:weather-lightning-rainy',
                  'snowy-rainy': 'mdi:weather-snowy-rainy'
                } %}
                {{ icons.get(states(weather), 'mdi:weather-cloudy') }}
            - type: column
              gap: 8
              justify: center
              elements:
                - type: text
                  font: !input font
                  size: "{{ (height | int * 0.16 * (text_scale | int) / 100) | int }}"
                  value: >-
                    {{ state_attr(weather, 'temperature') }}{{ state_attr(weather, 'temperature_unit') }}
                - type: text
                  font: !input font
                  size: "{{ (height | int * 0.07 * (text_scale | int) / 100) | int }}"
                  value: "{{ state_translated(weather) }}"
mode: single
