version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
    day: monday
  labels:
  - dependencies
  - tests
  exclude-paths:
  - requirements_test_min.txt
  - constraints/homeassistant-min.txt
  groups:
    home-assistant-test:
      patterns:
      - homeassistant
      - pytest-homeassistant-custom-component
      - bluetooth-sensor-state-data
      - sensor-state-data
    lint:
      patterns:
      - ruff
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
  labels:
  - dependencies
  - ci
  cooldown:
    exclude:
    - eigger/hass-repo-standards
    - eigger/hass-repo-standards/*
  groups:
    central-standards:
      patterns:
      - eigger/hass-repo-standards
      - eigger/hass-repo-standards/*
