# Shared standards: eigger/hass-repo-standards @ f0ce06b (reviewed 2026-10-18).
name: Validate
'on':
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:
  schedule:
  - cron: 23 3 * * 1
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: eigger/hass-repo-standards/.github/workflows/validate-integration.yml@f0ce06bc9a8e3a51fc8260777b30750d368f4983
  standards:
    name: Central template compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.14'
    - uses: eigger/hass-repo-standards/actions/check-standards@f0ce06bc9a8e3a51fc8260777b30750d368f4983
