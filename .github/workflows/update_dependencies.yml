# Shared standards: eigger/hass-repo-standards @ 0ec3111 (reviewed 2026-10-21).
name: Update dependencies
'on':
  schedule:
  - cron: 41 4 * * 1
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  dependencies:
    permissions:
      contents: write
      pull-requests: write
    uses: eigger/hass-repo-standards/.github/workflows/dependency-update.yml@v1.1.1
    with:
      domain: ble_esl
      packages: '["imagespec", "blesession"]'
      python-version: '3.14'
      test-profile: ha
      ha-components: 'bluetooth usb recorder diagnostics frontend panel_custom websocket_api'
      validation-command: python -m ruff check . && python -m ruff format --check . && python -m pytest tests/components/ble_esl/ -v --timeout 120 --ignore=tests/components/ble_esl/test_payload_examples.py
