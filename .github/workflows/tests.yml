# Shared standards: eigger/hass-repo-standards @ 0ec3111 (reviewed 2026-10-21).
name: Tests
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Current Home Assistant (requirements_test.txt), plus the exact minimum
  # imagespec/blesession versions declared in manifest.json.
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@0c1592977591ecba077a4666d699840062711201
    with:
      standards-ref: 0c1592977591ecba077a4666d699840062711201
      domain: ble_esl
      python-versions: '["3.14"]'
      requirements: requirements_test.txt
      dependency-modes: '["current", "minimum"]'
      minimum-packages: '["imagespec", "blesession"]'
      ha-components: 'bluetooth usb recorder diagnostics frontend panel_custom websocket_api'
      expected-ha-version: '2026.10.1'
      test-profile: ha
      pytest-args: tests/components/ble_esl/ -v --timeout 120
  # Exact minimum Home Assistant declared in hacs.json (2025.12.0). Its
  # plugin/Python pair is separate from current and is not raised with it.
  minimum-ha:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@0c1592977591ecba077a4666d699840062711201
    with:
      standards-ref: 0c1592977591ecba077a4666d699840062711201
      domain: ble_esl
      python-versions: '["3.13"]'
      requirements: requirements_test_min.txt
      constraints: constraints/homeassistant-min.txt
      ha-components: 'bluetooth usb recorder diagnostics frontend panel_custom websocket_api'
      expected-ha-version: '2025.12.0'
      test-profile: ha
      pytest-args: tests/components/ble_esl/ -v --timeout 120
  # The visual editor's browser tests use their own runner and a demo server,
  # so they run beside the Python tests.
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    # The demo server renders with the integration's own code, which imports
    # the same Home Assistant components the Python tests need.
    - uses: eigger/hass-repo-standards/actions/python-environment@0c1592977591ecba077a4666d699840062711201 # validated environment implementation
      with:
        domain: ble_esl
        python-version: '3.14'
        requirements: requirements_test.txt
        ha-components: 'bluetooth usb recorder diagnostics frontend panel_custom websocket_api'
        expected-ha-version: '2026.10.1'
        test-profile: ha
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: npm
    - run: |
        npm ci
        npx playwright install --with-deps chromium
    - name: Test visual editor
      timeout-minutes: 5
      env:
        DESIGNER_PYTHON: python
      run: npm test
