name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install -r requirements_lint.txt

      - name: Lint
        run: python -m ruff check custom_components/ tests/ docs/ scripts/

      - name: Format check
        run: python -m ruff format --check custom_components/ tests/ docs/ scripts/

  test:
    # Tests run against a real Home Assistant (pytest-homeassistant-custom-component),
    # which requires the Python version current Home Assistant needs.
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements_test.txt
          python -c "import json; print('\n'.join(json.load(open('custom_components/ble_esl/manifest.json'))['requirements']))" > requirements.txt
          pip install -r requirements.txt
          python scripts/ha_component_requirements.py bluetooth usb recorder diagnostics > requirements_ha.txt
          pip install -r requirements_ha.txt

      - name: Run tests
        run: python -m pytest tests/ -v --timeout 120
